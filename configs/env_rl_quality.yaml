# RL-oriented oval env: richer signals for PPO (opt-in obs + shaped rewards).
# Observation is 19 + 3 (smoothed actuator) + 1 (grip) + 2 (tire usage) = 25-D.
# Optional schema_version defaults to 1; unknown keys are rejected.
schema_version: 1
track: configs/tracks/oval.yaml
simulation:
  dt: 0.02
  frame_skip: 4
  max_episode_steps: 3000
  initial_speed: 2.0
model:
  xml: assets/mjcf/world.xml
vehicle: configs/vehicles/touring.yaml
termination:
  off_track_margin: 0.5
  no_progress_window_steps: 250
  no_progress_min_delta: 15.0
reset_randomization:
  enabled: true
  progress: true
  lateral_offset: 1.5
  heading_error: 0.25
  speed_min: 1.0
  speed_max: 4.0
  grip_min: 0.95
  grip_max: 1.05
observation:
  lookahead_distances: [6.0, 12.0, 24.0, 40.0]
  curvature_scale: 20.0
  include_prev_action: true
  include_grip_scale: true
  include_tire_usage: true
reward:
  progress: 1.0
  time: 0.002
  lateral_error: 0.05
  heading_error: 0.02
  boundary_margin: 0.25
  boundary_margin_start: 1.25
  progress_gate: 6.0
  progress_gate_spacing: 0.1
  speed_excess: 0.03
  target_speed_max: 9.5
  target_speed_min: 3.5
  target_speed_curvature_gain: 3.5
  no_progress: 20.0
  off_track: 35.0
  lap_complete: 100.0
  tire_usage: 0.4
  action_rate: 0.02
