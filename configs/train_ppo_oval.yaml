seed: 0
total_timesteps: 250000
output_dir: results/ppo_oval
env:
  env_configs:
    - configs/env.yaml
  randomize_reset: true
  lap_target: 1.0
  max_episode_steps: 1500
ppo:
  policy: MlpPolicy
  n_steps: 1024
  batch_size: 256
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  clip_range: 0.2
eval:
  env_config: configs/env.yaml
  frequency: 10000
  episodes: 3
  max_steps: 1500
  deterministic: true
live:
  enabled: true
  directory: results/ppo_oval/live
