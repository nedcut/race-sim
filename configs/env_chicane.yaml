track: configs/tracks/chicane.yaml
simulation:
  dt: 0.02
  frame_skip: 4
  max_episode_steps: 3000
  initial_speed: 2.0
model:
  xml: assets/mjcf/world_chicane.xml
vehicle: configs/vehicles/touring.yaml
control:
  drivetrain: rwd
  max_steer_angle: 0.45
  steer_rate: 5.0
  throttle_rate: 5.0
  brake_rate: 8.0
  max_drive_force: 2500.0
  max_brake_force: 1400.0
  front_cornering_stiffness: 7000.0
  rear_cornering_stiffness: 8000.0
  max_lateral_force: 5000.0
  yaw_damping: 180.0
  linear_drag: 4.0
  rolling_resistance: 8.0
  wheelbase: 1.35
  center_of_mass_to_front: 0.68
  center_of_mass_to_rear: 0.67
termination:
  off_track_margin: 0.5
reward:
  progress: 1.0
  lateral_error: 0.05
  heading_error: 0.02
  off_track: 25.0
reset_randomization:
  enabled: false
  progress: true
  lateral_offset: 1.5
  heading_error: 0.25
  speed_min: 1.0
  speed_max: 4.0
