name: touring
description: Baseline grippy RWD touring car used by the track env configs.
control:
  drivetrain: rwd
  max_steer_angle: 0.45
  steer_rate: 5.0
  throttle_rate: 5.0
  brake_rate: 8.0
  max_drive_force: 2500.0
  max_brake_force: 1400.0
  front_cornering_stiffness: 7000.0
  rear_cornering_stiffness: 8000.0
  max_lateral_force: 5000.0
  yaw_damping: 180.0
  linear_drag: 4.0
  rolling_resistance: 8.0
  wheelbase: 1.35
  center_of_mass_to_front: 0.68
  center_of_mass_to_rear: 0.67
tire_model:
  center_of_mass_height: 0.28
  tire_friction_coefficient: null
  combined_slip_exponent: 2.0
  brake_front_bias: 0.6
  aero_downforce_coefficient: 0.0
  aero_front_balance: 0.5
  peak_slip_angle: 0.12
  lateral_saturation_softness: 1.15
  longitudinal_saturation_softness: 1.0
  low_speed_slip_floor: 1.2
