name: kart
description: Lightweight direct-feeling kart with fast steering and modest power.
control:
  drivetrain: rwd
  max_steer_angle: 0.62
  steer_rate: 8.0
  throttle_rate: 7.0
  brake_rate: 10.0
  max_drive_force: 1250.0
  max_brake_force: 1050.0
  front_cornering_stiffness: 4200.0
  rear_cornering_stiffness: 4600.0
  max_lateral_force: 2800.0
  yaw_damping: 90.0
  linear_drag: 2.6
  rolling_resistance: 6.0
  wheelbase: 1.05
  center_of_mass_to_front: 0.52
  center_of_mass_to_rear: 0.53
tire_model:
  center_of_mass_height: 0.22
  tire_friction_coefficient: null
  combined_slip_exponent: 2.0
  brake_front_bias: 0.55
  aero_downforce_coefficient: 0.0
  aero_front_balance: 0.5
